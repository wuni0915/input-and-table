<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact_ex</title>
    <link rel="stylesheet" href="css/contact_ex.css">
</head>
<body>
    <form action="" class="contact_form">
        <h2>문의하기</h2>
        <label for="name">이름</label>
        <input type="text" id="name" placeholder="이름을 입력하세요." required>
        <label for="email">email</label>
        <input type="email" id="email" placeholder="이메일을 입력하세요" required>
        <label for="category">문의 유형</label>
        <select name="" id="category">
            <option value="">상품문의</option>
            <option value="">배송문의</option>
            <option value="">환불문의</option>
            <option value="">기타문의</option>
        </select>
        <label for="contact">문의 내용</label>
        <textarea name="" id="contact" placeholder="문의 내용을 입력하세요"></textarea>
        <button class="btn_submit">문의 하기</button>
    </form>
</body>
</html>
